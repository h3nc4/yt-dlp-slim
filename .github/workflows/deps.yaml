name: Dependency branch

on:
  push:
    branches:
      - "main"
      - "deps"
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deps:
    name: Sync or promote deps
    runs-on: ubuntu-latest
    steps:
      - name: Request an app token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: "4811373"
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Run h3nc4/deps-branch-action
        uses: h3nc4/deps-branch-action@21271243e7d3ddfb1bfe08661dd7a17343e29b05 # v1
        with:
          token: ${{ steps.app-token.outputs.token }}
